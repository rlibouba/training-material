- doc: Test outline for short_workflow.ga
  job:
    Genome sequence:
      class: File
      location: https://zenodo.org/records/13987091/files/S_pombe_chrIII_genome.fasta
      filetype: fasta
    Genome assembly:
      class: File
      location: https://zenodo.org/records/13987091/files/S_pombe_trinity_assembly.fasta
      filetype: fasta
    Protein sequences:
      class: File
      location: https://zenodo.org/records/13987091/files/Swissprot_no_S_pombe.fasta
      filetype: fasta
    Augustus training:
      class: File
      location: https://zenodo.org/records/4406623/files/augustus_training_2.tar.gz.augustus
      filetype: augustus
    SNAP training:
      class: File
      location: https://zenodo.org/records/13987091/files/snap_training2.snaphmm
      filetype: snaphmm


  outputs:
    busco sum genome quality:
      asserts:
        - has_n_lines:
            n: 20
            delta: 2
        - has_text:
            text: "BUSCO version is: 5.8.0"
            text: "494at4751"
    busco table genome quality:
      asserts:
        - has_text:
            text: "BUSCO version is: 5.8.0"
    
    stats genome quality:
      asserts:
        - has_n_lines:
            n: 14
            delta: 2
        - has_text:
            text: "GC_content"
            text: "2452883"
    
    maker gff:
      asserts:
        - has_n_lines:
            n: 6253
            delta: 10
        - has_text:
            text: "##gff-version 3"
            text: "NC_003421.2"
    
    Busco summary final round:
      asserts:
        - has_n_lines:
            n: 20
            delta: 2
        - has_text:
            text: "BUSCO version is: 5.8.0"
    Busco table final round:
      asserts:
        - has_text:
            text: "BUSCO version is: 5.8.0"
